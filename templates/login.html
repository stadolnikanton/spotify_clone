{% extends "base.html" %}    
{% block content %}
<div class="d-flex flex-column align-items-center">
        <h1>Вход</h1>
        <form method="post">
        {% csrf_token %}
        <p>
            <label class="form-label">Имя пользователя:</label><br>
            <input type="text" name="username" class="form-control">
        </p>
        <p>
            <label for="inputPassword5" class="form-label">Пароль:</label>
            <input name="password" type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
        </p>
        <button type="submit" class="btn btn-dark">Войти</button>
    <p>Нет аккаунта? <a class="btn btn-link" href="{% url 'register' %}">Зарегистрироваться</a></p>
    </form>
</div>
{% endblock %}
