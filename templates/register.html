{% extends "base.html" %}    
{% load socialaccount %}
{% block content %}
<div class="d-flex flex-column align-items-center">

    <h1>Регистрация</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-dark">Зарегистрироваться</button>
        <div class="text-center mb-3">
                        <span class="text-muted">или</span>
                    </div>
                    <div class="text-center">
                        <a href="{% url 'google_login' %}" class="btn btn-outline-danger w-100">
                            <i class="fab fa-google"></i> Зарегистрироваться через Google
                        </a>
                    </div>
        <p>Уже есть аккаунт? <a class="btn btn-link" href="{% url 'login' %}">Войти</a></p>
    </form>
</div>
{% endblock %}
